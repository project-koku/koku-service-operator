[pytest]
testpaths = suites
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --junit-xml=reports/junit.xml

# Show WARNING+ log messages on the CLI in real-time so that session-scoped
# fixture output (_rbac_bootstrap, s3_bucket_preflight, etc.) is visible in
# Prow CI logs even when the fixture itself succeeds.
log_cli = true
log_cli_level = WARNING

# =============================================================================
# Test Markers
# =============================================================================
# Use markers to organize tests into logical groups that can be run independently
# or in combination.
#
# Run examples:
#   pytest -m smoke                    # Quick validation tests
#   pytest -m "helm"                   # Helm chart tests only
#   pytest -m "auth"                   # Authentication tests only
#   pytest -m "infrastructure"         # Infrastructure health tests
#   pytest -m "cost_management"        # Koku pipeline tests
#   pytest -m "ros"                    # ROS/Kruize tests
#   pytest -m "e2e"                    # End-to-end tests
#   pytest -m "ui"                     # UI tests only (Playwright)
#   pytest -m "not ui"                 # Exclude UI tests
#   pytest -m "scenario"               # YAML-driven scenario tests
#   pytest -m "not slow"               # Skip slow tests
#   pytest -m "smoke and auth"         # Smoke tests in auth suite
#   pytest suites/helm/                # Run entire helm suite
#   pytest suites/e2e/ -m smoke        # E2E smoke tests only
#
# Test type filtering:
#   pytest -m component                # Single-component tests
#   pytest -m integration              # Multi-component tests
#   pytest -m "component and helm"     # Component tests in helm suite
#   pytest -m "integration and auth"   # Integration tests in auth suite
#
# Performance test filtering:
#   pytest -m performance              # All performance tests
#   pytest -m "performance and ingestion"    # Ingestion throughput tests
#   pytest -m "performance and scale"        # Multi-cluster scale tests
#   pytest -m "performance and api_latency"  # API latency tests
#   pytest -m "performance and ros_perf"     # ROS/Kruize performance tests
#   pytest -m "performance and soak"         # Long-running soak tests
#   pytest suites/performance/               # All performance suite tests
#
# New test categories:
#   pytest -m scenario                 # YAML-driven scenario tests (35 tests)
#   pytest suites/infrastructure/test_kafka.py    # Kafka validation
#   pytest suites/infrastructure/test_storage.py  # S3/Storage preflight
#   pytest suites/cost_management/test_cost_validation.py     # Cost validation
# =============================================================================

markers =
    # Suite markers (one per test file/class)
    helm: Helm chart validation tests (lint, template, deployment health)
    auth: JWT authentication tests (Keycloak, ingress, backend)
    infrastructure: Infrastructure health tests (DB, S3, Kafka, storage)
    cost_management: Cost Management (Koku) pipeline tests
    sources: Sources API tests (CRUD, authentication, schema validation)
    ros: ROS/Kruize recommendation tests
    e2e: End-to-end cross-suite tests
    ui: Browser-based UI tests using Playwright
    api: External API tests via gateway route (direct HTTP with JWT auth)
    interpod: Tests that execute inside the cluster via test-runner pod (pod-to-pod)
    
    # Test type markers
    component: Tests that validate a single component in isolation
    integration: Tests that validate interactions between multiple components
    
    # Cross-cutting markers (can be combined with suite markers)
    smoke: Quick smoke tests for basic functionality validation
    slow: Tests that take longer to run (processing, recommendations)
    scenario: YAML-driven scenario tests for different workload patterns
    cost_validation: Cost calculation validation tests (metrics, tolerances)
    data_validation: UI tests that validate data display (requires E2E data setup)
    
    # Performance test markers (FLPATH-4036)
    performance: Performance tests for throughput, latency, and scale validation
    ingestion: Ingestion throughput tests (PERF-ING-*)
    scale: Multi-cluster scale tests (PERF-SCALE-*)
    api_latency: API response time tests (PERF-API-*)
    ros_perf: ROS/Kruize performance tests (PERF-ROS-*)
    soak: Long-running stability tests (PERF-SOAK-*)
    valkey_eviction: Valkey eviction correlation tests (PERF-VK-*, COST-7605)
    db_sweep: PostgreSQL resource sweep tests (PERF-DB-*, COST-7605)
    kafka_throughput: Kafka throughput and scaling tests (PERF-KAF-*, COST-7638)
    celery_scaling: Celery worker scaling and OOM tests (PERF-CEL-*, COST-7598)
    stress: Stress ramp-to-failure and backlog recovery tests (PERF-STR-*, COST-7627)
    stress_ramp: Stress ramp-to-failure only (PERF-STR-001)
    stress_recovery: Stress backlog recovery only (PERF-STR-002)
    rbac_perf: RBAC authorization performance tests (COST-7643)

# Default timeout for non-performance tests (seconds).
# Performance tests set their own @pytest.mark.timeout() — ensure those are
# always higher than this default or pytest-timeout will override them silently.
timeout = 300

# JUnit XML suite name (for CI dashboards)
junit_suite_name = cost-onprem-chart-pytest

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::urllib3.exceptions.InsecureRequestWarning

# Add tests directory to Python path for imports
pythonpath = .