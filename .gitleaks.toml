# Gitleaks config for koku-service-operator.
# Allowlist known non-production BYOI fixture credentials and doc examples.
# Real secrets must never be added here — fix the leak instead.

title = "koku-service-operator"

[extend]
useDefault = true

[allowlist]
description = "Dev-only BYOI fixtures (fixed lab credentials — not for production) and release artifacts"
paths = [
  '''(^|/)config/samples/byoi/''',
  '''(^|/)docs/jira/''',
  '''(^|/)releases/''',
  # Recorded registry API responses for the offline registry-client tests.
  # The docker.io token fixture is an ANONYMOUS, EXPIRED pull token (5-minute
  # validity at capture time, exp long past) — public API data, not a secret.
  '''(^|/)scripts/testdata/registry/''',
]

# Explicit fixture credential strings (also referenced outside byoi YAML).
regexes = [
  '''byoi-postgres-password''',
  '''byoi-koku-password''',
  '''byoi-ros-password''',
  '''byoi-kruize-password''',
  '''byoi-rbac-password''',
  '''byoi-valkey-password''',
  '''byoi-minio-access''',
  '''byoi-minio-secret-key''',
  # deploy-rhbk_test.sh fixture stub: obviously-fake token string exercising
  # the credential-hygiene assertions (safe_curl moves real credentials out
  # of argv); the curl-auth-header rule matches the literal test header.
  '''super-secret-token''',
]

# Recorded registry API responses live in scripts/testdata/registry/ (see the
# paths allowlist above): expired anonymous pull tokens, public API data.
