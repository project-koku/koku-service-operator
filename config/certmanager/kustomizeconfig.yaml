# This configuration is for teaching kustomize how to update name and namespace references.
nameReference:
- kind: Issuer
  group: cert-manager.io
  fieldSpecs:
  - kind: Certificate
    group: cert-manager.io
    path: spec/issuerRef/name

namespace:
- kind: Certificate
  group: cert-manager.io
  path: metadata/namespace
  create: true
- kind: Issuer
  group: cert-manager.io
  path: metadata/namespace
  create: true
