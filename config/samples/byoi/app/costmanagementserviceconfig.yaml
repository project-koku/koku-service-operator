# Separate BYOI CostManagementServiceConfig — deploy:false for DB/cache.
# Point clusterDomain at your cluster's apps domain before relying on Routes.
apiVersion: service.costmanagement.openshift.io/v1alpha1
kind: CostManagementServiceConfig
metadata:
  name: cost-management
  namespace: cost-byoi
spec:
  global:
    clusterDomain: "apps.cluster.example.com"
    storageClass: ""

  database:
    deploy: false
    host: "postgresql.cost-byoi-infra.svc.cluster.local"
    port: 5432
    sslMode: "disable"
    secretName: "byoi-db-credentials"

  cache:
    deploy: false
    host: "valkey.cost-byoi-infra.svc.cluster.local"
    port: 6379
    auth:
      enabled: true
      secretName: "byoi-cache-credentials"
    tls:
      enabled: false

  kafka:
    # AMQ Streams from ./config/samples/byoi/deploy-kafka.sh (default names).
    bootstrapServers: "cost-onprem-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"
    securityProtocol: "PLAINTEXT"

  objectStorage:
    endpoint: "minio.cost-byoi-infra.svc.cluster.local"
    port: 9000
    useSSL: false
    secretName: "byoi-s3-credentials"
    s3:
      region: "us-east-1"
      addressingStyle: "path"

  costManagement:
    storage:
      bucketName: "koku-bucket"
      rosBucketName: "ros-data"
    api:
      image:
        # amd64 — suitable for clusterbot / typical OpenShift nodes
        repository: quay.io/redhat-services-prod/cost-mgmt-dev-tenant/koku
        tag: "768be82"
      replicas: 1
    masu:
      image:
        repository: quay.io/redhat-services-prod/cost-mgmt-dev-tenant/koku
        tag: "768be82"
      replicas: 1
    listener:
      replicas: 1
    celery:
      workers:
        default:
          replicas: 1
        priority:
          replicas: 1
        summary:
          replicas: 1
        ocp:
          replicas: 1
        costModel:
          replicas: 1

  # Beta: ROS and Kruize are out of scope. Keep enabled: false (also the CRD
  # default). Set enabled: true and fill ros.image / kruize.image only when opting in.
  ros:
    enabled: false

  rbac:
    image:
      repository: quay.io/redhat-services-prod/hcc-accessmanagement-tenant/insights-rbac
      tag: "73870d8"
    api:
      replicas: 1
    worker:
      replicas: 1

  ingress:
    image:
      repository: quay.io/iop/ingress
      tag: "master"

  # Envoy JWT gateway requires a reachable Keycloak/RHBK JWKS endpoint.
  # Placeholder URL — replace with a real Keycloak before exercising the /api Route.
  auth:
    keycloak:
      # JWKS fetch URL (prefer in-cluster Service). When RHBK sets a public
      # hostname, tokens use that URL as iss — set issuerURL to match.
      url: "http://keycloak-service.keycloak.svc.cluster.local:8080"
      # issuerURL: "https://keycloak-keycloak.apps.example.com"
      # tls:
      #   insecureSkipVerify: true   # dev only when issuer uses a private CA
      realm: "kubernetes"
      audiences:
        - "cost-management-operator"
        - "cost-management-ui"
    envoy:
      image:
        repository: registry.redhat.io/openshift-service-mesh/proxyv2-rhel9
        tag: "2.6"
      replicas: 1

  # Empty repository/tag produces InvalidImageName (image ":"). Set both.
  ui:
    replicaCount: 1
    # Default Secret name: {metadata.name}-ui-oauth-client — see mirror-ui-oauth-secret.sh
    app:
      image:
        repository: quay.io/insights-onprem/koku-ui-onprem
        tag: "2f23c646581028bd385856b6713e6bf367baf953"
    oauthProxy:
      image:
        repository: registry.redhat.io/rhceph/oauth2-proxy-rhel9
        tag: "v7.6.0"

  monitoring:
    enabled: false
