# Separate BYOI CostManagementServiceConfig for Cluster Bot / day-one smoke.
# Uses lightweight Redpanda in cost-byoi-infra (no AMQ Streams OLM install).
#
# Happy path:
#   ./hack/clusterbot-smoke.sh
#   IMG=… ./hack/deploy-incluster.sh cost-byoi
#
# Or manually: apply infra + kafka.yaml, copy secrets, then this CR.
# Patch spec.global.clusterDomain to your apps.* domain before relying on Routes.
# Without Keycloak, gateway/UI auth conditions stay False — core BYOI still progresses.
apiVersion: service.costmanagement.openshift.io/v1alpha1
kind: CostManagementServiceConfig
metadata:
  name: cost-management
  namespace: cost-byoi
spec:
  global:
    clusterDomain: "apps.cluster.example.com"
    storageClass: ""

  database:
    deploy: false
    host: "postgresql.cost-byoi-infra.svc.cluster.local"
    port: 5432
    sslMode: "disable"
    secretName: "byoi-db-credentials"

  cache:
    deploy: false
    host: "valkey.cost-byoi-infra.svc.cluster.local"
    port: 6379
    auth:
      enabled: true
      secretName: "byoi-cache-credentials"
    tls:
      enabled: false

  kafka:
    # Redpanda stand-in — config/samples/byoi/infra/kafka.yaml
    # For AMQ Streams instead, use the default sample CR + deploy-kafka.sh / deploy-byoi.sh.
    bootstrapServers: "kafka.cost-byoi-infra.svc.cluster.local:9092"
    securityProtocol: "PLAINTEXT"

  objectStorage:
    endpoint: "minio.cost-byoi-infra.svc.cluster.local"
    port: 9000
    useSSL: false
    secretName: "byoi-s3-credentials"
    s3:
      region: "us-east-1"
      addressingStyle: "path"

  costManagement:
    storage:
      bucketName: "koku-bucket"
      rosBucketName: "ros-data"
    api:
      image:
        repository: quay.io/redhat-services-prod/cost-mgmt-dev-tenant/koku
        tag: "768be82"
      replicas: 1
    masu:
      image:
        repository: quay.io/redhat-services-prod/cost-mgmt-dev-tenant/koku
        tag: "768be82"
      replicas: 1
    listener:
      replicas: 1
    celery:
      workers:
        default:
          replicas: 1
        priority:
          replicas: 1
        summary:
          replicas: 1
        ocp:
          replicas: 1
        costModel:
          replicas: 1

  # Beta: ROS/Kruize out of scope — CRD default is false.
  ros:
    enabled: false

  rbac:
    image:
      repository: quay.io/redhat-services-prod/hcc-accessmanagement-tenant/insights-rbac
      tag: "73870d8"
    api:
      replicas: 1
    worker:
      replicas: 1

  ingress:
    image:
      repository: quay.io/iop/ingress
      tag: "master"

  auth:
    keycloak:
      # Placeholder — set a real Keycloak Service URL + issuerURL for UI / gateway auth.
      url: "http://keycloak-service.keycloak.svc.cluster.local:8080"
      realm: "kubernetes"
      audiences:
        - "cost-management-operator"
        - "cost-management-ui"
    envoy:
      image:
        repository: registry.redhat.io/openshift-service-mesh/proxyv2-rhel9
        tag: "2.6"
      replicas: 1

  ui:
    replicaCount: 1
    app:
      image:
        repository: quay.io/insights-onprem/koku-ui-onprem
        tag: "2f23c646581028bd385856b6713e6bf367baf953"
    oauthProxy:
      image:
        repository: registry.redhat.io/rhceph/oauth2-proxy-rhel9
        tag: "v7.6.0"

  monitoring:
    enabled: false
