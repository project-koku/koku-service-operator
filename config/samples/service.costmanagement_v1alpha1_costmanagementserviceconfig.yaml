# Default CostManagementServiceConfig — BYOI (Bring Your Own Infrastructure).
#
# This is a production-oriented TEMPLATE, not a ready-to-apply CR. External
# dependencies (database, cache, Kafka, object storage, Keycloak) are left empty
# on purpose: the operator never provisions or guesses infrastructure it does
# not own, so it will not silently point you at endpoints you did not choose.
# Fill in the empty required fields below for your environment.
#
# Admission intentionally REJECTS this CR until you provide, at minimum:
#   - database.host + database.secretName        (or set database.deploy: true)
#   - cache.host + cache.auth.secretName         (or set cache.deploy: true)
#   - kafka.bootstrapServers
#   - auth.keycloak.url
#   - objectStorage.endpoint + secretName + buckets.koku
#     (or leave all three empty to let discovery resolve an in-cluster bucket)
#
# For a turnkey dev/ci/lab config with bundled Postgres/Valkey and public
# images, use the community sample instead (name: cost-onprem-community):
#   service.costmanagement_v1alpha1_costmanagementserviceconfig_community.yaml
# For fuller external examples, see the _minimal, _byoi, and _production samples.
apiVersion: service.costmanagement.openshift.io/v1alpha1
kind: CostManagementServiceConfig
metadata:
  name: cost-onprem
  namespace: cost-onprem
spec:
  global:
    clusterDomain: "apps.cluster.local"
    storageClass: ""  # empty = use cluster default; set to ocs-storagecluster-ceph-rbd on ODF clusters

  database:
    deploy: false
    host: ""
    port: 5432
    sslMode: "require"
    secretName: ""

  cache:
    deploy: false
    host: ""
    port: 6379
    auth:
      enabled: true
      secretName: ""

  kafka:
    bootstrapServers: ""

  ingress:
    image:
      repository: quay.io/iop/ingress
      tag: "master"

  # Object storage is BYOI: the operator never creates buckets. Provide your own
  # S3-compatible endpoint + credentials, or leave endpoint/secretName empty to
  # let discovery resolve an in-cluster ODF/NooBaa bucket (OBC).
  objectStorage:
    endpoint: ""
    port: 443
    useSSL: true
    secretName: ""
    buckets:
      # Required when objectStorage.secretName is set; otherwise resolved by
      # discovery. Ingress uploads inherit this bucket unless buckets.ingress is
      # set. Add buckets.ros only when ros.enabled: true.
      koku: ""

  costManagement:
    api:
      image:
        repository: quay.io/redhat-services-prod/cost-mgmt-dev-tenant/koku
        tag: "768be82"
      replicas: 1
    masu:
      image:
        repository: quay.io/redhat-services-prod/cost-mgmt-dev-tenant/koku
        tag: "768be82"
      replicas: 1
    listener:
      replicas: 2
    celery:
      workers:
        default:
          replicas: 1
        priority:
          replicas: 1
        summary:
          replicas: 2
        ocp:
          replicas: 2
        costModel:
          replicas: 1

  # Beta: ROS and Kruize are out of scope — omit or keep enabled: false (CRD default).
  # Set enabled: true and fill ros.image / kruize.image only when opting in.
  ros:
    enabled: false
    image:
      repository: quay.io/redhat-services-prod/insights-management-tenant/insights-ocp-resource-optimization/ros-ocp-backend
      tag: "ae8c990"
    processor:
      replicas: 1

  rbac:
    image:
      repository: quay.io/redhat-services-prod/hcc-accessmanagement-tenant/insights-rbac
      tag: "73870d8"
    api:
      replicas: 1
    worker:
      replicas: 1

  # Only applied when ros.enabled: true
  kruize:
    replicas: 1
    image:
      repository: quay.io/redhat-services-prod/kruize-autotune-tenant/autotune
      tag: "d1f0140"

  # Envoy JWT gateway requires a reachable Keycloak/RHBK JWKS endpoint.
  # Without it, gateway pods can become Ready while API calls return 401.
  auth:
    envoy:
      # OSSM 2.6 is deprecated; do not change this tag without checking the
      # operator Envoy bootstrap still matches.
      image:
        repository: registry.redhat.io/openshift-service-mesh/proxyv2-rhel9
        tag: "2.6"
      replicas: 2
    keycloak:
      # Required: URL the operator-managed gateway should use to reach your
      # external Keycloak/RHBK identity provider for JWKS discovery.
      # Prefer a cluster-reachable Service URL when available.
      url: ""
      # Required JWKS fetch URL (prefer in-cluster Service). When RHBK sets a
      # public hostname, tokens use that URL as iss — set issuerURL to match.
      # For CRC + RHBK/BYOI, override to
      # http://keycloak-service.keycloak.svc.cluster.local:8080 (and TLS as needed).
      # issuerURL: "https://keycloak-keycloak.apps.example.com"
      # tls:
      #   caCertSecretName: "keycloak-ca"

  ui:
    replicaCount: 1
    # User-provided OAuth client Secret (keys: client-id, client-secret).
    # Default name: {metadata.name}-ui-oauth-client. Mirror from Keycloak with:
    #   ./config/samples/byoi/mirror-ui-oauth-secret.sh
    # oauthClientSecretRef:
    #   name: cost-management-ui-oauth-client
    oauthProxy:
      image:
        repository: registry.redhat.io/rhceph/oauth2-proxy-rhel9
        tag: "v7.6.0"
    app:
      image:
        repository: quay.io/insights-onprem/koku-ui-onprem
        tag: "2f23c646581028bd385856b6713e6bf367baf953"

  monitoring:
    enabled: true
