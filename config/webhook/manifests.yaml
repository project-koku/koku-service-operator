---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-service-costmanagement-openshift-io-v1alpha1-costmanagementserviceconfig
  failurePolicy: Fail
  name: mcostmanagementserviceconfig.kb.io
  rules:
  - apiGroups:
    - service.costmanagement.openshift.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - costmanagementserviceconfigs
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-service-costmanagement-openshift-io-v1alpha1-costmanagementserviceconfig
  failurePolicy: Fail
  name: vcostmanagementserviceconfig.kb.io
  rules:
  - apiGroups:
    - service.costmanagement.openshift.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - costmanagementserviceconfigs
  sideEffects: None
