# Prometheus Monitor Service (Metrics)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: koku-service-operator
    app.kubernetes.io/managed-by: kustomize
  name: controller-manager-metrics-monitor
  namespace: system
spec:
  endpoints:
    - path: /metrics
      port: https # Service port name; the current manager endpoint is HTTP.
      # The manager exposes :8443 without SecureServing; the Service port keeps
      # the scaffolded "https" name for compatibility.
      scheme: http
      interval: 30s
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: koku-service-operator
