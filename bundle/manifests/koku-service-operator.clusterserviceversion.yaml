spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: CostManagementServiceConfig is the schema for the on-premise Cost
        Management deployment.
      displayName: Cost Management Service Config
      kind: CostManagementServiceConfig
      name: costmanagementserviceconfigs.service.costmanagement.openshift.io
      version: v1alpha1
  description: |
    Kubernetes operator for self-managed (on-premise) Cost Management on OpenShift.
    Install via OLM, apply a CostManagementServiceConfig, and the operator deploys
    and manages the Cost Management stack against external infrastructure
    (PostgreSQL, Kafka, S3, OIDC). Beta channel — APIs and behavior may still change.
  displayName: Cost Management Service Operator
  icon:
