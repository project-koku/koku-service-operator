apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: koku-service-operator
    control-plane: controller-manager
  name: koku-service-operator-controller-manager-metrics-monitor
spec:
  endpoints:
  - interval: 30s
    path: /metrics
    port: https
    scheme: http
  selector:
    matchLabels:
      app.kubernetes.io/name: koku-service-operator
      control-plane: controller-manager
