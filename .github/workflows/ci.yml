name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # go vet is covered by the govet linter in .golangci.yml (and again via make test).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  hack-scripts:
    name: Hack Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: demo-preprod helpers
        run: make test-hack

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build manager
        run: go build -o /dev/null ./cmd/main.go

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Cache envtest binaries
        uses: actions/cache@v5
        with:
          path: bin/k8s
          key: envtest-${{ runner.os }}-${{ hashFiles('go.mod') }}

      - name: Run tests (unit + envtest integration)
        run: make test

      - name: Coverage gate (internal packages)
        run: make coverage-gate

      - name: Coverage summary
        run: |
          echo '### Test Coverage' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          go tool cover -func=cover.out | grep -E 'total:|\.go:' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f cover.internal.out ]; then
            echo '' >> $GITHUB_STEP_SUMMARY
            echo '### Internal coverage (gate)' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            go tool cover -func=cover.internal.out | grep '^total:' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  check-generated:
    name: Check Generated Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Regenerate deep-copy and CRD manifests
        # Use the same targets developers run locally so CI drift matches
        # `make generate manifests` (paths, webhook, RBAC outputs).
        run: make generate manifests

      - name: Fail if generated files are stale
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated files are out of date. Run 'make generate manifests' locally and commit."
            git diff --stat
            exit 1
          fi

  bundle-validate:
    name: Bundle Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # controller-gen/kustomize/operator-sdk are downloaded fresh into bin/
      # (gitignored); cache them keyed on the pinned versions in the Makefile
      # so most runs skip the download.
      - name: Cache bundle build tools
        uses: actions/cache@v5
        with:
          path: bin
          key: bundle-tools-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Regenerate bundle
        run: make bundle

      - name: Detect drift (committed vs generated)
        # `createdAt` is stamped with the current wall-clock time on every
        # `make bundle` run, so it isn't meaningful drift on its own -- ignore
        # hunks where it's the only changed line. bundle.Dockerfile lives
        # outside bundle/ but is regenerated by the same command, so include
        # it explicitly.
        run: |
          if ! git diff --ignore-matching-lines='^[[:space:]]*createdAt:' --quiet -- bundle/ bundle.Dockerfile; then
            echo "::error::bundle/ (or bundle.Dockerfile) is out of sync. Run 'make bundle' and commit."
            git diff --stat -- bundle/ bundle.Dockerfile
            exit 1
          fi

      - name: Validate bundle (OperatorHub + multiarch)
        # `make bundle` already runs the default `operator-sdk bundle
        # validate ./bundle`; this adds the optional suites. Reuses the
        # Makefile-downloaded, version-pinned operator-sdk binary instead of
        # a second hardcoded install, so there's one source of truth for the
        # version.
        run: ./bin/operator-sdk bundle validate ./bundle --select-optional name=operatorhub/v2 --select-optional name=multiarch

  links:
    name: Check Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            'docs/**/*.md'
            'README.md'
            'CLAUDE.md'
          fail: true

  container-build:
    name: Container Build
    runs-on: ubuntu-latest
    env:
      PUSH_IMAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Quay.io
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USER }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: quay.io/project-koku/koku-service-operator
          tags: |
            type=raw,value=latest,enable=${{ env.PUSH_IMAGE }}
            type=raw,value=main,enable=${{ env.PUSH_IMAGE }}
            type=raw,value={{sha}},enable=${{ env.PUSH_IMAGE }}
            type=raw,value=ci,enable=${{ env.PUSH_IMAGE != 'true' }}

      - name: Build and push container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: ${{ env.PUSH_IMAGE }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bundle-publish:
    name: Bundle & Catalog Images
    runs-on: ubuntu-latest
    needs: [bundle-validate, container-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USER }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Bundle image metadata
        id: bundle-meta
        uses: docker/metadata-action@v5
        with:
          images: quay.io/project-koku/koku-service-operator-bundle
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=raw,value={{sha}}

      - name: Build and push bundle image
        id: bundle-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: bundle.Dockerfile
          push: true
          tags: ${{ steps.bundle-meta.outputs.tags }}
          labels: ${{ steps.bundle-meta.outputs.labels }}

      - name: Install opm
        run: make opm

      - name: Build and push catalog image
        run: |
          # Match operator/bundle short-SHA tags (metadata-action {{sha}} default length).
          SHORT_SHA="${GITHUB_SHA::7}"
          CATALOG_IMG="quay.io/project-koku/koku-service-operator-catalog:${SHORT_SHA}"
          make catalog-build \
            BUNDLE_IMGS=quay.io/project-koku/koku-service-operator-bundle@${{ steps.bundle-push.outputs.digest }} \
            CATALOG_IMG="${CATALOG_IMG}"
          docker tag "${CATALOG_IMG}" \
            quay.io/project-koku/koku-service-operator-catalog:latest
          docker tag "${CATALOG_IMG}" \
            quay.io/project-koku/koku-service-operator-catalog:main
          docker push "${CATALOG_IMG}"
          docker push quay.io/project-koku/koku-service-operator-catalog:latest
          docker push quay.io/project-koku/koku-service-operator-catalog:main

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Pin Kind and verify the download checksum (via helm/kind-action).
      # install_only: make test-e2e creates the cluster itself.
      - name: Install Kind
        uses: helm/kind-action@v1.14.0
        with:
          version: v0.32.0
          install_only: true

      - name: Run e2e tests
        run: make test-e2e
