name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # go vet is covered by the govet linter in .golangci.yml (and again via make test).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          # All known standard library vulnerabilities in go1.25.0.
          # go mod tidy bumped go.mod from 1.24→1.25 when upgrading x/text and
          # x/net to fix third-party CVEs; go1.25.0 itself has many stdlib vulns.
          # TODO: remove suppressions after upgrading go.mod to go1.25.12+
          SUPPRESSED="
            GO-2025-4007 GO-2025-4008 GO-2025-4009 GO-2025-4010 GO-2025-4011
            GO-2025-4012 GO-2025-4013 GO-2025-4155 GO-2025-4175
            GO-2026-4337 GO-2026-4340 GO-2026-4341
            GO-2026-4601 GO-2026-4602
            GO-2026-4865 GO-2026-4870 GO-2026-4918
            GO-2026-4946 GO-2026-4947 GO-2026-4971
            GO-2026-5037 GO-2026-5038 GO-2026-5039 GO-2026-5856
          "
          set +e
          output=$(govulncheck ./... 2>&1)
          rc=$?
          echo "$output"
          if [ $rc -eq 0 ]; then
            exit 0
          fi
          # Extract every GO-XXXX-YYYY ID that govulncheck reported, then
          # remove the suppressed ones. Anything left is an unsuppressed finding.
          found=$(echo "$output" | grep -oE 'GO-[0-9]+-[0-9]+' | sort -u)
          unsuppressed=""
          for id in $found; do
            if ! echo "$SUPPRESSED" | grep -qw "$id"; then
              unsuppressed="$unsuppressed $id"
            fi
          done
          if [ -z "$unsuppressed" ]; then
            echo "::notice::govulncheck findings suppressed: $SUPPRESSED (go1.25.0 stdlib vulns, fixed in go1.25.11+)"
            exit 0
          fi
          echo "::error::Unsuppressed vulnerabilities:$unsuppressed"
          exit 1

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build manager
        run: go build -o /dev/null ./cmd/main.go

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Cache envtest binaries
        uses: actions/cache@v5
        with:
          path: bin/k8s
          key: envtest-${{ runner.os }}-${{ hashFiles('go.mod') }}

      - name: Run tests (unit + envtest integration)
        run: make test

      - name: Coverage summary
        run: |
          echo '### Test Coverage' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          go tool cover -func=cover.out | grep -E 'total:|\.go:' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  check-generated:
    name: Check Generated Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Regenerate deep-copy and CRD manifests
        # Use the same targets developers run locally so CI drift matches
        # `make generate manifests` (paths, webhook, RBAC outputs).
        run: make generate manifests

      - name: Fail if generated files are stale
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated files are out of date. Run 'make generate manifests' locally and commit."
            git diff --stat
            exit 1
          fi

  links:
    name: Check Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            'docs/**/*.md'
            'README.md'
            'CLAUDE.md'
          fail: true

  container-build:
    name: Container Build
    runs-on: ubuntu-latest
    env:
      PUSH_IMAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Quay.io
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USER }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: quay.io/project-koku/koku-service-operator
          tags: |
            type=raw,value=latest,enable=${{ env.PUSH_IMAGE }}
            type=raw,value=main,enable=${{ env.PUSH_IMAGE }}
            type=raw,value={{sha}},enable=${{ env.PUSH_IMAGE }}
            type=raw,value=ci,enable=${{ env.PUSH_IMAGE != 'true' }}

      - name: Build and push container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: ${{ env.PUSH_IMAGE }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Pin Kind and verify the download checksum (via helm/kind-action).
      # install_only: make test-e2e creates the cluster itself.
      - name: Install Kind
        uses: helm/kind-action@v1.14.0
        with:
          version: v0.32.0
          install_only: true

      - name: Run e2e tests
        env:
          # Operator uses plain HTTP metrics on :8080, not cert-manager TLS on :8443.
          # Skip cert-manager until COST-7697 adapts the e2e suite.
          CERT_MANAGER_INSTALL_SKIP: "true"
        run: make test-e2e
